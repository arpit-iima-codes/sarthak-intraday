# /etc/nginx/sites-available/sarthak-intraday
# ln -s ../sites-available/sarthak-intraday /etc/nginx/sites-enabled/
#
# Basic-auth password file (htpasswd not installed; use openssl):
#   HASH=$(openssl passwd -apr1 'YOUR_PASSWORD')
#   printf 'sarthak:%s\n' "$HASH" | sudo tee /etc/nginx/.htpasswd-sarthak
#   sudo chown root:www-data /etc/nginx/.htpasswd-sarthak && sudo chmod 640 /etc/nginx/.htpasswd-sarthak
server {
    server_name 80.225.196.44.nip.io;

    client_max_body_size 2m;

    location / {
        auth_basic "sarthak-intraday";
        auth_basic_user_file /etc/nginx/.htpasswd-sarthak;

        proxy_pass http://127.0.0.1:8092;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket upgrade (live-price stream for the screener, later)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/80.225.196.44.nip.io/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/80.225.196.44.nip.io/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = 80.225.196.44.nip.io) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name 80.225.196.44.nip.io;
    return 404; # managed by Certbot


}